[project]
name = "fizz-buzz-kata-python"
version = "0.0.1"
description = "Fizz Buzz kata in Python"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Alvaro", email = "" }
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "approvaltests>=14.0.0",
    "approval_utilities>=14.0.0",
    "pre-commit>=3.8.0"
]

[tool.mypy]
strict = true
follow_imports = 'skip'
warn_unreachable = true
warn_return_any = true
disallow_untyped_calls = true
ignore_missing_imports = true
warn_unused_configs = true
exclude = [".venv"]
